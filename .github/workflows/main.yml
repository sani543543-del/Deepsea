
name: Render Deepsea MP4

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Render Deepsea Video
        run: npx remotion render index.ts Main out/video.mp4 --codec h264 --crf 17

      - name: Upload MP4 Video
        uses: actions/upload-artifact@v4
        with:
          name: Deepsea-MP4
          path: out/video.mp4
          retention-days: 7
          
